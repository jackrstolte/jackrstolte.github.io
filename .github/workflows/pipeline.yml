name: Weekly Pipeline

on:
  schedule:
    - cron: "0 6 * * 0"   # Sunday 6 AM UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install \
            pandas \
            requests \
            python-dotenv \
            beautifulsoup4 \
            lxml

      - name: Run pipeline
        run: python main.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/ laws_cache.csv votes_cache.csv 
          git commit -m "Weekly pipeline update $(date -u '+%Y-%m-%d')" || echo "No changes"
          git pull --rebase origin main
          git push
